<script>
/* В Telegram: на своём хостинге подключите скрипт telegram-web-app.js (адрес в документации Telegram Mini Apps) в head страницы */
const C=JSON.parse(document.getElementById("cfg").textContent),$=id=>document.getElementById(id);
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();}
const fmt=n=>n.toLocaleString("ru-RU")+" "+C.currency;
let cur=null,size=null,color=null,tab="c";
$("brand").textContent=C.shop;document.title=C.shop+" — каталог";
const tick=C.notes.map(n=>"<span>"+n+"</span>").join("<span>✕</span>");$("track").innerHTML=(tick+"<span>✕</span>").repeat(4);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
let cat="all",qry="";
function norm(t){return (t||"").trim().toLowerCase();}
function renderCats(){
  $("srch").hidden=C.products.length<3;
  const seen=new Map();C.products.forEach(p=>{const k=norm(p.category);if(k&&!seen.has(k))seen.set(k,p.category.trim());});
  const box=$("cats");box.textContent="";
  if(seen.size<2){box.hidden=true;cat="all";return;}
  if(cat!=="all"&&!seen.has(cat))cat="all";
  const add=(k,t)=>{const b=el("button","",t);b.type="button";b.setAttribute("aria-pressed",cat===k);b.onclick=()=>{cat=k;renderCats();renderGrid();};box.appendChild(b);};
  add("all","Все");seen.forEach((t,k)=>add(k,t));box.hidden=false;
}
function renderSkeleton(){$("grid").textContent="";for(let i=0;i<4;i++)$("grid").appendChild(el("li","skel"));}
function renderGrid(){
  $("grid").textContent="";
  const list=C.products.filter(p=>(cat==="all"||norm(p.category)===cat)&&(!qry||[p.name,p.category,(p.colors||[]).join(" ")].join(" ").toLowerCase().replace(/ё/g,"е").includes(qry)));
  if(!list.length&&qry)$("grid").appendChild(el("li","empty","Ничего не найдено"));
  list.forEach(p=>{
    const li=el("li"),b=el("button","card"+(p.inStock===false?" out":""));b.type="button";
    const pic=el("div","pic");
    if(p.photos&&p.photos[0]){const im=el("img");im.src=p.photos[0];im.alt=p.name;im.loading="lazy";im.decoding="async";im.onerror=()=>{if(drvAlt(im))return;im.remove();pic.insertBefore(el("div","nophoto","нет фото"),pic.firstChild);};pic.appendChild(im);}
    else pic.appendChild(el("div","nophoto","нет фото"));
    if(p.inStock===false)pic.appendChild(el("span","tagout","нет в наличии"));
    const inn=el("div","in");inn.append(el("div","nm",p.name),el("div","pr",fmt(p.price)));
    b.append(pic,inn);if(p.inStock===false)b.disabled=true;else b.onclick=()=>openP(p);li.appendChild(b);$("grid").appendChild(li);
  });
  if(cat==="all"&&!qry)for(let i=0;i<(C.soon||0);i++)$("grid").appendChild(el("li","slot","soon"));
}
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c=='"')q=true;else if(c==","){r.push(f);f="";}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f="";}else f+=c;}if(f!==""||r.length){r.push(f);rows.push(r);}return rows;}
/* Разбор ячеек таблицы: продавец пишет как удобно, страница приводит к одному виду */
const SZ=["XXS","XS","S","M","L","XL","XXL","XXXL"];
function parseSizes(t){
  t=(t||"").replace(/one[\s-]*size/ig,"ONESIZE").replace(/\s*[-–—]\s*/g,"-");
  const out=[];
  t.split(/[\s,;]+/).filter(Boolean).forEach(x=>{
    if(/^ONESIZE$/i.test(x)){out.push("one-size");return;}
    let m=x.match(/^(\d+)-(\d+)$/);
    if(m){const a=+m[1],b=+m[2];if(a<=b&&b-a<=40){for(let i=a;i<=b;i++)out.push(String(i));return;}}
    m=x.match(/^([A-Za-z]+)-([A-Za-z]+)$/);
    if(m){const a=SZ.indexOf(m[1].toUpperCase()),b=SZ.indexOf(m[2].toUpperCase());if(a>-1&&b>=a){out.push(...SZ.slice(a,b+1));return;}}
    out.push(x);
  });
  return [...new Set(out)];
}
function parseColors(t){t=(t||"").trim();if(!t)return[];const parts=/[,;\n]/.test(t)?t.split(/[,;\n]+/):t.split(/\s+/);return [...new Set(parts.map(x=>x.trim().replace(/_/g," ")).filter(Boolean))];}
function parsePrice(t){let p=(t||"").replace(/[^\d.,]/g,"");if(/^\d{1,3}([.,]\d{3})+$/.test(p))p=p.replace(/[.,]/g,"");else p=p.replace(",",".");return Number(p)||0;}
function drvAlt(i){if(i.dataset.r||!/drive\.google\.com\/thumbnail\?id=/.test(i.src))return false;i.dataset.r=1;i.src="https://lh3.googleusercontent.com/d/"+new URL(i.src).searchParams.get("id")+"=w1200";return true;}
function fixPhoto(u){u=u.trim();const m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);return m?"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w1200":u;}
/* Каталог из Google Таблицы. Колонки: name, price, category, sizes, colors, photos, in_stock. Если таблица недоступна, показывается встроенный каталог. */
async function loadSheet(){
  if(!C.sheetUrl)return;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  try{
    const res=await fetch(C.sheetUrl,{cache:"no-store",signal:ctl.signal});if(!res.ok)throw new Error(res.status);
    const rows=parseCSV(await res.text()).filter(r=>r.some(x=>x.trim()));
    const h=rows.shift().map(x=>x.trim().toLowerCase());
    const builtin={};C.products.forEach(p=>builtin[norm(p.name)]=p);
    const list=rows.map((r,i)=>{
      const g=n=>{const k=h.indexOf(n);return k<0?"":(r[k]||"").trim();};
      const name=g("name"),fb=builtin[norm(name)];
      let photos=(g("photos").match(/https?:\/\/.*?(?=https?:\/\/|[\s,;]|$)/g)||[]).map(fixPhoto);
      if(!photos.length&&fb)photos=fb.photos;
      return{id:i+1,name,price:parsePrice(g("price")),category:g("category"),sizes:parseSizes(g("sizes")),colors:parseColors(g("colors")),photos,inStock:!/^(no|нет|немає|0|false|sold|продано)/i.test(g("in_stock"))};
    }).filter(p=>p.name);
    if(list.length){C.products=list;C.soon=0;try{localStorage.setItem("shopcache1",JSON.stringify(list));}catch(e){}}
  }catch(e){console.warn("Таблица недоступна, показан встроенный каталог",e);}
  finally{clearTimeout(to);renderCats();renderGrid();}
}
function reviewCard(r){const d=el("div","rc");if(r.sample)d.appendChild(el("div","ex","пример"));d.appendChild(el("div","au",r.author||"Покупатель"));if(r.text)d.appendChild(el("p","",r.text));if(r.image){const i=el("img");i.src=r.image;i.alt="Отзыв";i.loading="lazy";i.onerror=()=>i.remove();d.appendChild(i);}return d;}
function renderReviews(){const all=(C.reviews||[]).filter(r=>(r.text||r.image)&&!(C.sheetUrl&&r.sample));$("rv").textContent="";all.forEach(r=>$("rv").appendChild(reviewCard(r)));$("tabr").hidden=!all.length;$("rcount").textContent=all.length?" ("+all.length+")":"";if(!all.length&&tab==="r")showTab("c");}
async function loadReviews(){
  if(!C.reviewsUrl)return;
  try{
    const res=await fetch(C.reviewsUrl,{cache:"no-store"});if(!res.ok)throw new Error(res.status);
    const rows=parseCSV(await res.text()).filter(r=>r.some(x=>x.trim()));
    const h=rows.shift().map(x=>x.trim().toLowerCase());
    const list=rows.map(r=>{const g=n=>(r[h.indexOf(n)]||"").trim();return{author:g("author"),text:g("text"),image:g("image"),product:g("product")};}).filter(r=>r.text||r.image);
    C.reviews=list;renderReviews();
  }catch(e){console.warn("Отзывы недоступны",e);}
}
$("ftTg").href="https://t.me/"+C.telegram;$("ftNote").textContent=(C.notes||[]).join(" · ");
if(tg){try{tg.setHeaderColor&&tg.setHeaderColor("#0a0a0a");tg.setBackgroundColor&&tg.setBackgroundColor("#0a0a0a");}catch(e){}}
const qi=$("q"),qx=$("qx");qi.oninput=()=>{qry=norm(qi.value).replace(/ё/g,"е");qx.hidden=!qry;renderGrid();};qx.onclick=()=>{qi.value="";qry="";qx.hidden=true;renderGrid();qi.focus();};qi.onkeydown=e=>{if(e.key==="Enter")qi.blur();};
let hadCache=false;if(C.sheetUrl){try{const c=JSON.parse(localStorage.getItem("shopcache1")||"null");if(c&&c.length){C.products=c;C.soon=0;hadCache=true;}}catch(e){}}
if(C.sheetUrl&&!hadCache)renderSkeleton();else{renderCats();renderGrid();}
renderReviews();renderFaq();loadSheet();loadReviews();loadFaq();
function openP(p){
  if(tg&&tg.BackButton)tg.BackButton.show();cur=p;size=p.sizes.length?null:"";color=(p.colors&&p.colors.length)?null:"";$("sheet").hidden=false;$("sheet").scrollTop=0;document.body.style.overflow="hidden";
  $("pn").textContent=p.name;$("pp").textContent=fmt(p.price);
  $("snap").textContent="";
  if(!p.photos.length){const d=el("div");d.appendChild(el("div","nophoto","нет фото"));$("snap").appendChild(d);}
  p.photos.forEach(s=>{const d=el("div"),i=el("img");i.src=s;i.alt=p.name;i.onerror=()=>{if(drvAlt(i))return;i.remove();d.appendChild(el("div","nophoto","нет фото"));};d.appendChild(i);$("snap").appendChild(d);});
  $("snap").scrollLeft=0;$("thumbs").textContent="";$("thumbs").hidden=p.photos.length<2;
  p.photos.forEach((u,k)=>{const b=el("button"),i=el("img");b.type="button";b.setAttribute("aria-label","Фото "+(k+1));i.src=u;i.alt="";i.onerror=()=>{if(drvAlt(i))return;i.remove();};b.appendChild(i);b.onclick=()=>go(k);$("thumbs").appendChild(b);});cnt();
  $("pcat").textContent=p.category||"";$("pcat").hidden=!p.category;
  $("sizes").textContent="";p.sizes.forEach(z=>{const b=el("button","size",z);b.type="button";b.setAttribute("aria-pressed","false");
    b.onclick=()=>{size=z;[...$("sizes").children].forEach(x=>x.setAttribute("aria-pressed",x===b));upd();};$("sizes").appendChild(b);});
  const cl=p.colors||[];$("clab").hidden=$("colors").hidden=!cl.length;$("colors").textContent="";
  cl.forEach(z=>{const b=el("button","size col",z);b.type="button";b.setAttribute("aria-pressed","false");b.onclick=()=>{color=z;[...$("colors").children].forEach(x=>x.setAttribute("aria-pressed",x===b));upd();};$("colors").appendChild(b);});
  $("notes").textContent="";C.notes.forEach(n=>$("notes").appendChild(el("li","",n)));
  const pr=(C.reviews||[]).filter(r=>r.product&&r.product.toLowerCase()===p.name.toLowerCase()&&(r.text||r.image));$("prvl").textContent="";pr.forEach(r=>$("prvl").appendChild(reviewCard(r)));$("prv").hidden=!pr.length;
  upd();
}
function idx(){const w=$("snap").clientWidth||1;return Math.round($("snap").scrollLeft/w);}
function go(i){const n=cur?Math.max(1,cur.photos.length):1;i=Math.max(0,Math.min(n-1,i));$("snap").scrollTo({left:i*$("snap").clientWidth,behavior:"smooth"});}
function cnt(){const i=idx(),n=cur?Math.max(1,cur.photos.length):1;$("cnt").textContent=(i+1)+" / "+n;$("prev").hidden=n<2||i===0;$("next").hidden=n<2||i>=n-1;[...$("thumbs").children].forEach((b,k)=>b.setAttribute("aria-current",k===i));}
$("snap").addEventListener("scroll",cnt);
$("prev").onclick=()=>go(idx()-1);$("next").onclick=()=>go(idx()+1);
$("snap").addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();go(idx()-1);}if(e.key==="ArrowRight"){e.preventDefault();go(idx()+1);}});
(function(){let d=false,x=0,l=0;const z=$("snap");
 z.addEventListener("mousedown",e=>{d=true;x=e.pageX;l=z.scrollLeft;z.style.scrollSnapType="none";z.style.cursor="grabbing";});
 window.addEventListener("mousemove",e=>{if(d){z.scrollLeft=l-(e.pageX-x);}});
 window.addEventListener("mouseup",()=>{if(!d)return;d=false;z.style.cursor="";z.style.scrollSnapType="";go(idx());});
 z.addEventListener("dragstart",e=>e.preventDefault());})();
function upd(){
  const a=$("buy");
  if(color===null||size===null){a.textContent=color===null?"Выберите цвет":"Выберите размер";a.href="#";a.setAttribute("aria-disabled","true");return;}
  const text="Привет! Хочу заказать: "+cur.name+(color?", цвет "+color:"")+(size?", размер "+size:"")+", "+fmt(cur.price);
  a.textContent="Заказать в Telegram";a.href="https://t.me/"+C.telegram+"?text="+encodeURIComponent(text);a.setAttribute("aria-disabled","false");
}
$("buy").addEventListener("click",e=>{if(tg&&$("buy").getAttribute("aria-disabled")==="false"){e.preventDefault();tg.openTelegramLink($("buy").href);}});
(function(){const t=$("track"),slow=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches,v=slow?0.015:0.045;let x=0,last=performance.now();
  function f(now){const dt=Math.min(now-last,100);last=now;const half=t.offsetWidth/2;x-=dt*v;if(half>0&&-x>=half)x+=half;t.style.transform="translate3d("+x+"px,0,0)";t.style.webkitTransform=t.style.transform;requestAnimationFrame(f);}
  requestAnimationFrame(f);})();
function showTab(t){tab=t;[["c","tabc"],["r","tabr"],["f","tabf"]].forEach(([k,id])=>$(id).setAttribute("aria-selected",t===k));$("view-c").hidden=t!=="c";$("revs").hidden=t!=="r";$("faqv").hidden=t!=="f";}
$("tabc").onclick=()=>showTab("c");$("tabr").onclick=()=>showTab("r");$("tabf").onclick=()=>showTab("f");
function renderFaq(){const all=(C.faq||[]).filter(x=>x.q&&x.a);$("fq").textContent="";all.forEach(x=>{const d=el("details"),sm=el("summary","",x.q);d.append(sm,el("p","",x.a));$("fq").appendChild(d);});$("tabf").hidden=!all.length;if(!all.length&&tab==="f")showTab("c");}
async function loadFaq(){
  if(!C.faqUrl)return;
  try{
    const res=await fetch(C.faqUrl,{cache:"no-store"});if(!res.ok)throw new Error(res.status);
    const rows=parseCSV(await res.text()).filter(r=>r.some(x=>x.trim()));
    const h=rows.shift().map(x=>x.trim().toLowerCase());
    C.faq=rows.map(r=>{const g=n=>(r[h.indexOf(n)]||"").trim();return{q:g("question"),a:g("answer")};}).filter(x=>x.q&&x.a);renderFaq();
  }catch(e){console.warn("FAQ недоступен",e);}
}
function closeP(){$("sheet").hidden=true;document.body.style.overflow="";if(tg&&tg.BackButton)tg.BackButton.hide();}
$("back").onclick=closeP;
if(tg&&tg.BackButton)tg.BackButton.onClick(()=>{if(!$("sheet").hidden)closeP();});
